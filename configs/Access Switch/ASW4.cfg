! ASW4 - Access Block B
! Cisco IOS Layer 2 access switch; assumes Fa0/1-24 and Gi0/1-2.
! Proposed port layout: Finance 1-8, Servers 9-16, wired Guest 17-20.
! Gi0/1 connects to DSW1; Gi0/2 connects to DSW2.
! DSW trunks must allow 20,40,50,60,99 and use native VLAN 999.
! Distribution SVIs, HSRP, DHCP, routing and security policies are separate.
! Apply in global configuration mode; save afterward.
!
hostname ASW4
!
vlan 20
 name FINANCE
 exit
!
vlan 40
 name SERVERS
 exit
!
vlan 50
 name VOICE
 exit
!
vlan 60
 name GUEST
 exit
!
vlan 99
 name MANAGEMENT
 exit
!
vlan 999
 name UNUSED-NATIVE
 exit
!
spanning-tree mode rapid-pvst
!
interface range FastEthernet0/1 - 8
 description FINANCE_PC_AND_OPTIONAL_PHONE
 switchport mode access
 switchport access vlan 20
 switchport voice vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security mac-address sticky
 no shutdown
 exit
!
interface range FastEthernet0/9 - 16
 description SERVER_ENDPOINT
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security mac-address sticky
 no shutdown
 exit
!
interface range FastEthernet0/17 - 20
 description WIRED_GUEST_ENDPOINT
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security mac-address sticky
 no shutdown
 exit
!
interface range FastEthernet0/21 - 24
 description UNUSED_PORT
 switchport mode access
 switchport access vlan 999
 shutdown
 exit
!
interface GigabitEthernet0/1
 description TRUNK_TO_DSW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,40,50,60,99
 no shutdown
 exit
!
interface GigabitEthernet0/2
 description TRUNK_TO_DSW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,40,50,60,99
 no shutdown
 exit
!
interface Vlan99
 description SWITCH_MANAGEMENT
 ip address 10.10.99.14 255.255.255.0
 no shutdown
 exit
!
ip default-gateway 10.10.99.1
!
end