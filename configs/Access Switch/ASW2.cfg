! ASW2 - Access Block A
! Cisco IOS Layer 2 access-switch configuration
! Assumes Fa0/1-24 and Gi0/1-2; adjust to match hardware.
! Gi0/1 -> DSW1; Gi0/2 -> DSW2.
! Distribution trunks, SVIs, HSRP and routing must be configured separately.
!
hostname ASW2
!
vlan 10
 name ADMIN
 exit
!
vlan 30
 name ENGINEERING
 exit
!
vlan 50
 name VOICE
 exit
!
vlan 60
 name GUEST
 exit
!
vlan 99
 name MANAGEMENT
 exit
!
vlan 999
 name UNUSED-NATIVE
 exit
!
spanning-tree mode rapid-pvst
!
interface range FastEthernet0/1 - 8
 description ADMIN_PC_AND_OPTIONAL_PHONE
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security mac-address sticky
 no shutdown
 exit
!
interface range FastEthernet0/9 - 16
 description ENGINEERING_PC_AND_OPTIONAL_PHONE
 switchport mode access
 switchport access vlan 30
 switchport voice vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security mac-address sticky
 no shutdown
 exit
!
interface range FastEthernet0/17 - 20
 description WIRED_GUEST_ENDPOINT
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
 exit
!
interface range FastEthernet0/21 - 24
 description UNUSED_PORT
 switchport mode access
 switchport access vlan 999
 shutdown
 exit
!
interface GigabitEthernet0/1
 description TRUNK_TO_DSW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,60,99
 no shutdown
 exit
!
interface GigabitEthernet0/2
 description TRUNK_TO_DSW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,60,99
 no shutdown
 exit
!
interface Vlan99
 description SWITCH_MANAGEMENT
 ip address 10.10.99.12 255.255.255.0
 no shutdown
 exit
!
ip default-gateway 10.10.99.1
!
end