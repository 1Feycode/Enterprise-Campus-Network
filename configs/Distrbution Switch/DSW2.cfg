! DSW2 - Cisco IOS multilayer distribution switch
! Assumed interface layout: Fa0/1 ASW1, Fa0/2 ASW2, Fa0/3 ASW3, Fa0/4 ASW4.
! Fa0/23 is the single inter-distribution trunk; connect to peer Fa0/23.
! Adapt interface names to your hardware before applying.
! This file covers campus VLANs, SVIs, HSRP, Rapid PVST+ and split-scope DHCP.
! Core-facing links, default routes, WAN, DNS and security policies are NOT configured.
! No DHCP option 150: add your actual voice provisioning server when known.
! Apply to clean lab configuration in global configuration mode; save afterward.
!
hostname DSW2
ip routing
service dhcp
spanning-tree mode rapid-pvst
!
vlan 10
 name ADMIN
 exit
!
vlan 20
 name FINANCE
 exit
!
vlan 30
 name ENGINEERING
 exit
!
vlan 40
 name SERVERS
 exit
!
vlan 50
 name VOICE
 exit
!
vlan 60
 name GUEST
 exit
!
vlan 99
 name MANAGEMENT
 exit
!
vlan 999
 name UNUSED-NATIVE
 exit
!
spanning-tree vlan 20,40,60 priority 24576
spanning-tree vlan 10,30,50,99 priority 28672
spanning-tree vlan 999 priority 28672
!
ip dhcp excluded-address 10.10.10.1 10.10.10.174
ip dhcp excluded-address 10.10.10.250 10.10.10.254
ip dhcp excluded-address 10.10.20.1 10.10.20.174
ip dhcp excluded-address 10.10.20.250 10.10.20.254
ip dhcp excluded-address 10.10.30.1 10.10.30.174
ip dhcp excluded-address 10.10.30.250 10.10.30.254
ip dhcp excluded-address 10.10.40.1 10.10.40.174
ip dhcp excluded-address 10.10.40.250 10.10.40.254
ip dhcp excluded-address 10.10.50.1 10.10.50.174
ip dhcp excluded-address 10.10.50.250 10.10.50.254
ip dhcp excluded-address 10.10.60.1 10.10.60.174
ip dhcp excluded-address 10.10.60.250 10.10.60.254
ip dhcp excluded-address 10.10.99.1 10.10.99.174
ip dhcp excluded-address 10.10.99.250 10.10.99.254
!
ip dhcp pool ADMIN
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 exit
!
ip dhcp pool FINANCE
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 exit
!
ip dhcp pool ENGINEERING
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 exit
!
ip dhcp pool SERVERS
 network 10.10.40.0 255.255.255.0
 default-router 10.10.40.1
 exit
!
ip dhcp pool VOICE
 network 10.10.50.0 255.255.255.0
 default-router 10.10.50.1
 exit
!
ip dhcp pool GUEST
 network 10.10.60.0 255.255.255.0
 default-router 10.10.60.1
 exit
!
ip dhcp pool MANAGEMENT
 network 10.10.99.0 255.255.255.0
 default-router 10.10.99.1
 exit
!
interface Vlan10
 description ADMIN_GATEWAY
 ip address 10.10.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 no shutdown
 exit
!
interface Vlan20
 description FINANCE_GATEWAY
 ip address 10.10.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 110
 no shutdown
 exit
!
interface Vlan30
 description ENGINEERING_GATEWAY
 ip address 10.10.30.3 255.255.255.0
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 100
 no shutdown
 exit
!
interface Vlan40
 description SERVERS_GATEWAY
 ip address 10.10.40.3 255.255.255.0
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 110
 no shutdown
 exit
!
interface Vlan50
 description VOICE_GATEWAY
 ip address 10.10.50.3 255.255.255.0
 standby version 2
 standby 50 ip 10.10.50.1
 standby 50 priority 100
 no shutdown
 exit
!
interface Vlan60
 description GUEST_GATEWAY
 ip address 10.10.60.3 255.255.255.0
 standby version 2
 standby 60 ip 10.10.60.1
 standby 60 priority 110
 no shutdown
 exit
!
interface Vlan99
 description MANAGEMENT_GATEWAY
 ip address 10.10.99.3 255.255.255.0
 standby version 2
 standby 99 ip 10.10.99.1
 standby 99 priority 100
 no shutdown
 exit
!
interface FastEthernet0/1
 description TRUNK_TO_ASW1
 switchport
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,60,99
 no shutdown
 exit
!
interface FastEthernet0/2
 description TRUNK_TO_ASW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,60,99
 no shutdown
 exit
!
interface FastEthernet0/3
 description TRUNK_TO_ASW3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,40,50,60,99
 no shutdown
 exit
!
interface FastEthernet0/4
 description TRUNK_TO_ASW4
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,40,50,60,99
 no shutdown
 exit
!
interface range FastEthernet0/23-24
 description TRUNK_TO_DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown
 exit
!
! VLAN 999 intentionally has no SVI, HSRP group or DHCP pool.
! DHCP split: DSW1 .100-.174; DSW2 .175-.249.
! Static addresses: .4-.99 and .250-.254; .1-.3 reserved for gateways.
end